<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0710" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Emberwake: The Last Waystone - a single-world action RPG." />

    <title>Emberwake — The Last Waystone</title>

    <style>
      :root {
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0710;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        font-family: ui-monospace, 'Courier New', monospace;
      }

      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #game canvas {
        display: block;
        touch-action: none;
      }

      /* ---- Pre-boot splash, visible until Phaser paints the first frame ---- */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 45%, #1d1226 0%, #0a0710 70%);
        z-index: 50;
        transition: opacity 420ms ease;
        padding: calc(var(--safe-t) + 16px) calc(var(--safe-r) + 16px)
          calc(var(--safe-b) + 16px) calc(var(--safe-l) + 16px);
      }

      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }

      #splash .glyph {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 3px solid #ff8a3c;
        border-top-color: transparent;
        border-right-color: #ffd27a;
        animation: spin 1.1s linear infinite;
        box-shadow: 0 0 24px rgba(255, 138, 60, 0.55);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #splash .title {
        color: #ffd9a0;
        font-size: clamp(14px, 3.4vw, 22px);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        text-shadow: 0 0 14px rgba(255, 138, 60, 0.6);
      }

      #splash .sub {
        color: #7a6b86;
        font-size: clamp(9px, 2vw, 12px);
        letter-spacing: 0.14em;
      }

      /* Landscape prompt for portrait phones */
      #rotate {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #0a0710;
        color: #ffd9a0;
        z-index: 60;
        text-align: center;
        padding: 24px;
      }

      #rotate .icon {
        font-size: 52px;
        animation: tilt 1.8s ease-in-out infinite;
      }

      @keyframes tilt {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(90deg);
        }
      }

      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }

      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #14060a;
        color: #ff9c9c;
        z-index: 70;
        padding: 24px;
        font-size: 13px;
        text-align: center;
        overflow: auto;
      }

      #fatal code {
        color: #ffd9a0;
        font-size: 11px;
        max-width: 90vw;
        white-space: pre-wrap;
        opacity: 0.85;
      }
    </style>
  </head>

  <body>
    <div id="game"></div>

    <div id="splash">
      <div class="glyph"></div>
      <div class="title">Emberwake</div>
      <div class="sub">The Last Waystone</div>
    </div>

    <div id="rotate">
      <div class="icon">📱</div>
      <div>Rotate your device to landscape</div>
    </div>

    <div id="fatal">
      <strong>Something broke.</strong>
      <code id="fatal-msg"></code>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
