name: Android APK

# Builds the Capacitor Android shell and uploads the debug APK as an artifact.
# Runs on every push to main so there is always a fresh installable build.
#
# This is the "GitHub builds the app" half of the pipeline: the game code is
# authored locally, and the APK is assembled here without needing a local
# Android SDK.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Build a release APK instead of debug
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emberwake-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "### APK built ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: *Artifacts → emberwake-debug-apk*" >> "$GITHUB_STEP_SUMMARY"
          echo "Install on a device with 'Unknown sources' enabled." >> "$GITHUB_STEP_SUMMARY"
